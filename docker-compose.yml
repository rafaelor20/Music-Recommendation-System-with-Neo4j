services:
  neo4j:
    image: neo4j:5.26.0-community
    container_name: music-recommendation-neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-music_graph_pass}
      NEO4J_server_memory_pagecache_size: 256M
      NEO4J_server_memory_heap_initial__size: 256M
      NEO4J_server_memory_heap_max__size: 512M
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./data/sample:/var/lib/neo4j/import
      - ./cypher:/cypher:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

volumes:
  neo4j_data:
    name: music_rec_neo4j_data
  neo4j_logs:
    name: music_rec_neo4j_logs
