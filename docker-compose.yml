services:
  neo4j:
    image: neo4j:5.26.0-community
    container_name: music-recommendation-neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-music_graph_pass}
      NEO4J_server_memory_pagecache_size: 256M
      NEO4J_server_memory_heap_initial__size: 256M
      NEO4J_server_memory_heap_max__size: 512M
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./data/sample:/var/lib/neo4j/import
      - ./cypher:/cypher:ro
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u '${NEO4J_USER:-neo4j}' -p '${NEO4J_PASSWORD:-music_graph_pass}' 'RETURN 1;' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  neo4j-init:
    image: neo4j:5.26.0-community
    container_name: music-recommendation-neo4j-init
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./cypher:/cypher:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        echo "Applying uniqueness constraints (00_constraints.cypher)..."
        cypher-shell -a bolt://neo4j:7687 -u "${NEO4J_USER:-neo4j}" -p "${NEO4J_PASSWORD:-music_graph_pass}" -f /cypher/00_constraints.cypher
        echo "Importing CSV dataset (01_import_data.cypher)..."
        cypher-shell -a bolt://neo4j:7687 -u "${NEO4J_USER:-neo4j}" -p "${NEO4J_PASSWORD:-music_graph_pass}" -f /cypher/01_import_data.cypher
        echo "Database initialization and import completed successfully!"
    restart: "no"

volumes:
  neo4j_data:
    name: music_rec_neo4j_data
  neo4j_logs:
    name: music_rec_neo4j_logs
